[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "femboyfind"          # проверь, что имя свободно на pypi.org
version = "0.1.0"
description = "Adults-only (18+) search aggregator with pluggable JSON and HTML providers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = []

[project.scripts]
femboyfind = "femboyfind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/femboyfind"]

[tool.pytest.ini_options]
pythonpath = ["src"]
